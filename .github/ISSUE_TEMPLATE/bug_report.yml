name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Describe el problema y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entra en Plan
        2. Marca la tarea…
        3. …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 130 en Android
  - type: textarea
    id: extra
    attributes:
      label: Capturas o detalles extra
