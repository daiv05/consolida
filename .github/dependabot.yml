version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "nuxt-*", "vue", "vue-*"]
      database:
        patterns: ["drizzle-*", "better-sqlite3", "@types/better-sqlite3"]
      tooling:
        patterns: ["typescript", "vitest", "vue-tsc"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
